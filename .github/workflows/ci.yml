name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  project-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify project docs exist
        run: |
          test -f AGENTS.md
          test -f SPEC.md
          test -f ARCH.md
          test -f TASK.md
          test -f README.md

      - name: Install dependencies
        run: npm ci

      - name: Run project check
        run: npm run check
